<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Super Mark</title>
<meta name="theme-color" content="#f5f5f4">
<meta name="description" content="把随手收藏的碎片化内容，变成一本可检索、可分类、有洞察的个人收藏册。">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%2312100d'/%3E%3Crect x='6' y='6' width='20' height='20' fill='%23ff5a2b'/%3E%3Crect x='12' y='12' width='8' height='8' fill='%2312100d'/%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Super Mark">
<script>
/* 首屏主题：跟随系统（默认）或用户手动选择，渲染前落地避免闪烁 */
(function () {
  try {
    var t = localStorage.getItem('supermark.theme');
    if (t !== 'light' && t !== 'dark') t = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = t;
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.content = t === 'dark' ? '#0c0a09' : '#f5f5f4';
  } catch (e) { document.documentElement.dataset.theme = 'light'; }
})();
</script>
<!-- 运行时数据（build 产物，不参与打包指纹）：file:// 下不存在，App 自动降级为空态 -->
<script src="./data/marks.js"></script>
<!-- 自诊断：模块脚本加载/执行失败时，把真实报错显示在页面上（黑屏排查用） -->
<script>
(function () {
  function show(msg) {
    try {
      var d = document.createElement('div');
      d.style.cssText = 'position:fixed;left:8px;right:8px;bottom:8px;z-index:9999;background:#7f1d1d;color:#fecaca;padding:10px 12px;border-radius:8px;font:12px/1.5 monospace;word-break:break-all;';
      d.textContent = '加载出错：' + msg;
      (document.body || document.documentElement).appendChild(d);
      try { localStorage.setItem('sm.lastError', String(msg)); } catch (e) {}
    } catch (e) { /* ignore */ }
  }
  window.addEventListener('error', function (e) {
    if (e && e.message && !/Script error/i.test(e.message)) show(e.message + ' @ ' + (e.filename || '') + ':' + (e.lineno || ''));
  }, true);
  window.addEventListener('unhandledrejection', function (e) {
    show('Promise: ' + (e.reason && (e.reason.stack || e.reason.message) || e.reason));
  });
  setTimeout(function () {
    var root = document.getElementById('root');
    if (root && !root.firstChild && !document.querySelector('[data-booted]')) {
      show('React 未挂载（root 为空）。若上方无具体报错，多为 iOS 版本过低或脚本被拦。');
    }
  }, 4000);
})();
</script>
</head>
<body>
<div id="root"></div>
<script type="module" src="/src/main.jsx"></script>
</body>
</html>
